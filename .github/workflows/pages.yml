# Publishes the local build (design/architecture.md, Local build) to GitHub Pages from main: the backend compiled to wasm and the
# web app around it, under the repository's name as base path. CI's "Local build" job has already tested the same
# build on the pull request. Pages must be set to deploy from GitHub Actions (Settings → Pages → Source).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer push doesn't cancel one that is going out.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"
  WASM_PACK_VERSION: "0.14.0"
  # Where wasm-pack keeps the tools it downloads (binaryen's wasm-opt, and wasm-bindgen built from source), so the
  # cache step below can name it.
  WASM_PACK_CACHE: /home/runner/.cache/.wasm-pack

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@${{ env.WASM_PACK_VERSION }}

      # wasm-pack downloads wasm-opt from github.com on first use, which fails now and then (a 504). The cache means
      # most runs don't download it; the lockfile in the key refreshes the wasm-bindgen it builds, and the restore
      # key keeps the older cache when only that changes.
      - uses: actions/cache@v4
        with:
          path: ${{ env.WASM_PACK_CACHE }}
          key: wasm-pack-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-pack-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # A cache miss still downloads wasm-opt, and wasm-pack picks the URL, so the build is tried up to 3 times. A
      # compile error fails all 3, with its message each time.
      - name: Build the backend
        run: |
          for i in 1 2 3; do
            npm run build:backend && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 10))
          done

      - name: Build the web app
        run: npm run build:local
        env:
          UPHEAP_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
