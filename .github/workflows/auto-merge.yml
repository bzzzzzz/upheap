# Turns on auto-merge for the repository owner's pull requests. GitHub then squash-merges them once the required
# checks pass; branch protection still decides when that is.
#
# It runs with the AUTO_MERGE_TOKEN secret, a fine-grained personal access token for this repository only (Contents and
# Pull requests: read and write). GitHub then merges as the owner, and the push to main triggers the workflows that
# run on it, CI and then Deploy; a merge made with the workflow's own token would trigger none. Without the secret it
# falls back to that token: pull requests still merge, but nothing runs after. The token can't merge a pull request
# that changes a workflow; merge those by hand.
#
# Only `pull_request`, never `pull_request_target`: for pull requests from forks this trigger gets a read-only
# token, so even a fork that edits this file can't merge anything.

name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    # The author is set by GitHub and can't be spoofed. Same-repo branches only, and drafts wait until ready.
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
