# Checks every pull request, and main after each merge (Deploy waits for that run). The rules come from
# design/engineering-principles.md:
# rustfmt and clippy are law, the OpenAPI file and the web types are generated and must not drift, and the web
# app lints with no warnings.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Test the API without agents, as the local build has it
        run: cargo test -p api --no-default-features --features accounts,trace-and-timeout --test local_user --locked

      - name: OpenAPI spec is up to date
        run: |
          cargo run --quiet --locked -p server -- openapi > openapi.json
          git diff --exit-code -- openapi.json || {
            echo "::error file=openapi.json::openapi.json is out of date. Regenerate it with: cargo run -q -p server -- openapi > openapi.json"
            exit 1
          }

  # The store and API suites again, on MySQL. Each test creates its own database on this server
  # (crates/store/src/testing.rs), so SQLite-only assumptions in migrations and queries fail here.
  mysql:
    name: MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Test on MySQL
        run: cargo test -p store -p api --locked

  # The same suites on Postgres, which production runs on (design/operations.md). It catches what neither
  # SQLite nor MySQL does: stricter types, ambiguous names in upserts, and a failed statement ending its transaction.
  postgres:
    name: Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Test on Postgres
        run: cargo test -p store -p api --locked

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error file=web/src/api/schema.d.ts::API types are out of date. Regenerate them with: cd web && npm run gen:api"
            exit 1
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

  # The local build (design/architecture.md, Local build): the backend without accounts, compiled to wasm and run on SQLite-wasm
  # in Node, and the web app built around it and tested in Chromium. Catches code that only builds natively, and
  # keeps the download within its budget.
  local:
    name: Local build
    runs-on: ubuntu-latest
    env:
      # Gzipped bytes of the backend wasm. It was 1.40 MB when the budget was last raised, with questions and
      # Waiting for me in it.
      WASM_GZIP_BUDGET: 1500000
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy without accounts
        run: cargo clippy -p service -p api --no-default-features --locked -- -D warnings

      - name: Clippy for wasm
        run: cargo clippy -p local --target wasm32-unknown-unknown --locked -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the backend
        run: npm run build:backend

      - name: Size budget
        run: |
          size=$(gzip -9c src/local/backend/local_bg.wasm | wc -c)
          echo "backend wasm: $size bytes gzipped, budget $WASM_GZIP_BUDGET"
          if [ "$size" -gt "$WASM_GZIP_BUDGET" ]; then
            echo "::error::The local build's wasm is $size bytes gzipped, over its budget of $WASM_GZIP_BUDGET."
            exit 1
          fi

      - name: Typecheck the worker
        run: npm run typecheck:local

      - name: Smoke test in Node
        run: npm run smoke:local

      # Builds the web app, serves it as GitHub Pages does and runs the golden paths that apply, with export and
      # import and the tab lock (web/playwright.local.config.ts).
      - name: Playwright against the static build
        run: npx playwright install --with-deps chromium && npm run e2e:local

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-local
          path: |
            web/playwright-report/local
            web/test-results/local
          retention-days: 7

  # The golden paths in a browser, against the real server binary on in-memory SQLite (web/playwright.config.ts).
  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium

      # Compiled here rather than inside Playwright's server start-up, so its time shows and doesn't count
      # against the start-up timeout.
      - name: Build server
        run: cargo build --locked -p server

      - name: Playwright
        working-directory: web
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
