# Simple deployment: one container, SQLite on a named volume.
# Put a TLS-terminating reverse proxy in front and set BASE_URL to its https:// address.
services:
  upheap:
    build: .
    ports:
      - "8080:8080"
    environment:
      BASE_URL: "http://localhost:8080"
      # ALLOW_REGISTRATION: "false"   # close sign-ups once your team has registered
    volumes:
      - heap-data:/data
    restart: unless-stopped

volumes:
  heap-data:
