[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/store",
    "crates/service",
    "crates/api-types",
    "crates/api",
    "crates/server",
    "crates/local",
    "crates/cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
store = { path = "crates/store", default-features = false }
# Without their default features, so the local build can leave accounts out; `server` turns them on.
service = { path = "crates/service", default-features = false }
api = { path = "crates/api", default-features = false }
api-types = { path = "crates/api-types" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
# Without `tokio` and `http1`, which only `server` needs (`axum::serve`), so the Router also builds for wasm.
axum = { version = "0.8", default-features = false, features = ["form", "json", "macros", "matched-path", "original-uri", "query", "tower-log", "tracing"] }
base64 = "0.22"
# The CLI's command line.
clap = { version = "4", features = ["derive"] }
# The CLI's config and data directories.
dirs = "6"
# Query strings for OAuth redirects; already in the tree through `url` and axum.
form_urlencoded = "1"
getrandom = "0.3"
googletest = "0.14"
http-body-util = "0.1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
js-sys = "0.3"
# The CLI's refresh token: the Windows credential manager, or the Secret Service on Linux and the BSDs over zbus,
# which is pure Rust, so building needs no libdbus. On macOS the CLI runs the system's `security` tool instead.
keyring = "4"
mime_guess = "2"
# The server's allocator: musl's own, which the Alpine image would otherwise use, is slow under many threads.
mimalloc = "0.1"
owo-colors = "4"
proptest = "1"
rand = "0.9"
# The CLI's HTTP client. rustls with ring, which sea-orm's driver already uses, and both the bundled and the system's
# root certificates, so a self-hosted server with a private CA works.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
rust-embed = "8"
sea-orm = { version = "2.0", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Query strings; already in the tree through axum and reqwest.
serde_urlencoded = "0.7"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
# Only what every user needs: `server` adds the multi-threaded runtime, signals and networking, which the local build
# (wasm) can't have.
tokio = { version = "1", features = ["rt"] }
toml = "0.8"
tower = "0.5"
# `api` adds `trace` and `timeout` with its `trace-and-timeout` feature; the browser can't run them.
tower-http = { version = "0.6", features = ["request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["uuid"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Opens the browser for `upheap auth login`.
webbrowser = "1"
# The machine's hostname, which `upheap auth login` names the sign-in with.
whoami = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Request handling and storage aren't hot loops, so they are built for size: the static web build ships them as
# WebAssembly, under a size budget (architecture.md, Local build, Build and publish). The server's release build takes
# the same setting, which costs it little. Ranking in `domain` stays at full speed.
[profile.release.package.api]
opt-level = "s"
[profile.release.package.api-types]
opt-level = "s"
[profile.release.package.service]
opt-level = "s"
[profile.release.package.store]
opt-level = "s"

# argon2 is unusably slow unoptimised; sign-in in debug builds would take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
