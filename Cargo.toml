[workspace]
resolver = "3"
members = ["crates/domain", "crates/store", "crates/service", "crates/api", "crates/server", "crates/local"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
store = { path = "crates/store", default-features = false }
# Without their default features, so the local build can leave accounts out; `server` turns them on.
service = { path = "crates/service", default-features = false }
api = { path = "crates/api", default-features = false }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
# Without `tokio` and `http1`, which only `server` needs (`axum::serve`), so the Router also builds for wasm.
axum = { version = "0.8", default-features = false, features = ["form", "json", "macros", "matched-path", "original-uri", "query", "tower-log", "tracing"] }
base64 = "0.22"
getrandom = "0.3"
googletest = "0.14"
http-body-util = "0.1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
js-sys = "0.3"
mime_guess = "2"
proptest = "1"
rand = "0.9"
rust-embed = "8"
sea-orm = { version = "2.0", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# Only what every user needs: `server` adds the multi-threaded runtime, signals and networking, which the local build
# (wasm) can't have.
tokio = { version = "1", features = ["rt"] }
tower = "0.5"
# `api` adds `trace` and `timeout` with its `trace-and-timeout` feature; the browser can't run them.
tower-http = { version = "0.6", features = ["request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["uuid"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# argon2 is unusably slow unoptimised; sign-in in debug builds would take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
