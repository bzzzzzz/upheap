[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/store",
    "crates/service",
    "crates/api-types",
    "crates/api",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
store = { path = "crates/store", default-features = false }
service = { path = "crates/service" }
api = { path = "crates/api" }
api-types = { path = "crates/api-types" }

anyhow = "1"
argon2 = "0.5"
# Without `tokio` and `http1`: `server` and the CLI's tests add them, to serve with `axum::serve`.
axum = { version = "0.8", default-features = false, features = ["form", "json", "macros", "matched-path", "original-uri", "query", "tower-log", "tracing"] }
base64 = "0.22"
# The CLI's command line.
clap = { version = "4", features = ["derive"] }
# The CLI's config and data directories.
dirs = "6"
# Query strings for OAuth redirects; already in the tree through `url` and axum.
form_urlencoded = "1"
getrandom = "0.3"
googletest = "0.14"
http-body-util = "0.1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# The CLI's refresh token: the Windows credential manager, or the Secret Service on Linux and the BSDs over zbus,
# which is pure Rust, so building needs no libdbus. On macOS the CLI runs the system's `security` tool instead.
keyring = "4"
mime_guess = "2"
# The server's allocator: musl's own, which the Alpine image would otherwise use, is slow under many threads.
mimalloc = "0.1"
owo-colors = "4"
proptest = "1"
rand = "0.9"
# The CLI's HTTP client. rustls with ring, which sea-orm's driver already uses, and both the bundled and the system's
# root certificates, so a self-hosted server with a private CA works.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
rust-embed = "8"
sea-orm = { version = "2.0", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Query strings; already in the tree through axum and reqwest.
serde_urlencoded = "0.7"
sha2 = "0.10"
# Signalling a process group, which std and tokio can't: stopping an agent tool with everything it started.
rustix = { version = "1", features = ["process"] }
tempfile = "3"
thiserror = "2"
# Only what every user needs: each binary and test suite adds the runtime flavour, signals, networking and timers it
# uses.
tokio = { version = "1", features = ["rt"] }
toml = "0.8"
tower = "0.5"
# `api` adds `trace` and `timeout`.
tower-http = { version = "0.6", features = ["request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["uuid"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }
# Opens the browser for `upheap auth login`.
webbrowser = "1"
# The machine's hostname, which `upheap auth login` names the sign-in with.
whoami = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# argon2 is unusably slow unoptimised; sign-in in debug builds would take seconds.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
