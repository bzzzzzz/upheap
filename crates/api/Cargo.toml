[package]
name = "api"
description = "HTTP API: axum routes, request and response types, OpenAPI, sessions and error responses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
api-types.workspace = true
axum.workspace = true
domain.workspace = true
form_urlencoded.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
service.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["timeout", "trace"] }
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
# The OIDC tests serve a fake provider with `axum::serve`.
axum = { workspace = true, features = ["http1", "tokio"] }
chrono.workspace = true
domain.workspace = true
googletest.workspace = true
http-body-util.workspace = true
openidconnect.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
# The tests open their database through `store::testing` (SQLite, or MySQL or Postgres with TEST_DATABASE_URL).
store = { workspace = true, features = ["testing"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
