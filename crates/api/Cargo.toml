[package]
name = "api"
description = "HTTP API: axum routes, request and response types, OpenAPI, sessions and error responses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["accounts", "trace-and-timeout"]
# Registration, sign-in, session cookies, OAuth and bearer tokens for the CLI, team management and user lookup.
# Without it every request is the local build's one user.
accounts = ["dep:form_urlencoded", "service/accounts"]
# The request span and the request timeout, which need `Instant::now()` and tokio's timer. The browser has neither.
trace-and-timeout = ["tower-http/trace", "tower-http/timeout"]

[dependencies]
api-types.workspace = true
axum.workspace = true
domain.workspace = true
form_urlencoded = { workspace = true, optional = true }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
service.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
domain.workspace = true
googletest.workspace = true
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The tests open their database through `store::testing` (SQLite, or MySQL or Postgres with TEST_DATABASE_URL).
store = { workspace = true, features = ["testing"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
