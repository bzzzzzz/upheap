[package]
name = "server"
description = "The upheap-server binary: config, startup, migrations and the embedded web app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "upheap-server"
path = "src/main.rs"

[features]
default = ["sqlite", "mysql", "postgres"]
sqlite = ["store/sqlite"]
mysql = ["store/mysql"]
postgres = ["store/postgres"]

[dependencies]
anyhow.workspace = true
api = { workspace = true, features = ["accounts", "trace-and-timeout"] }
axum = { workspace = true, features = ["http1", "tokio"] }
domain.workspace = true
mime_guess.workspace = true
rust-embed.workspace = true
serde_json.workspace = true
service = { workspace = true, features = ["accounts"] }
store.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
