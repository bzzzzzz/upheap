[package]
name = "cli"
description = "The upheap command-line client: items, heaps and signing in, over the HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "upheap"
path = "src/main.rs"

[dependencies]
api-types.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
getrandom = { workspace = true, features = ["std"] }
jiff.workspace = true
keyring.workspace = true
owo-colors.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
# Writing the config file whole: a temporary file in the same directory, renamed over it.
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
webbrowser.workspace = true

[dev-dependencies]
anyhow.workspace = true
# The tests run the CLI against the real API router, served on a localhost port.
api = { workspace = true, features = ["accounts"] }
axum = { workspace = true, features = ["http1", "tokio"] }
domain.workspace = true
googletest.workspace = true
service = { workspace = true, features = ["accounts"] }
store = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
