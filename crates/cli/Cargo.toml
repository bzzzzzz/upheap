[package]
name = "cli"
description = "The upheap command-line client: items, heaps and signing in, over the HTTP API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "upheap"
path = "src/main.rs"

[dependencies]
api-types.workspace = true
base64.workspace = true
clap.workspace = true
dirs.workspace = true
# Only the pure rules it shares with the server, such as how a step number is written.
domain.workspace = true
futures-util.workspace = true
getrandom = { workspace = true, features = ["std"] }
jiff.workspace = true
owo-colors.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
# Writing the config file whole: a temporary file in the same directory, renamed over it.
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
webbrowser.workspace = true
whoami.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# Everywhere but macOS, where the keychain is reached through the system's `security` tool (auth/security_tool.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring.workspace = true

[dev-dependencies]
anyhow.workspace = true
# The tests run the CLI against the real API router, served on a localhost port.
api.workspace = true
axum = { workspace = true, features = ["http1", "tokio"] }
googletest.workspace = true
service.workspace = true
store = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
