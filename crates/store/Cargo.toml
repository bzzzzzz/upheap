[package]
name = "store"
description = "Persistence: SeaORM entities, migrations and repositories. Converts between rows and domain types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sqlite", "mysql", "postgres"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
postgres = ["sea-orm/sqlx-postgres", "sea-orm-migration/sqlx-postgres"]
# A connection whose SQL runs somewhere SeaORM doesn't drive itself, such as SQLite-wasm in the local build.
proxy = ["sea-orm/proxy"]
# Test databases for the store and API suites (`store::testing`). Needs every driver to honour TEST_DATABASE_URL.
testing = ["sqlite", "mysql", "postgres"]

[dependencies]
domain.workspace = true
# Item keys for existing items, in the handles migration.
getrandom.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
googletest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Lets this crate's own integration tests use `store::testing`.
store = { path = ".", default-features = false, features = ["testing"] }

[lints]
workspace = true
