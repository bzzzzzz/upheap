[package]
name = "store"
description = "Persistence: SeaORM entities, migrations and repositories. Converts between rows and domain types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["sqlite", "mysql"]
sqlite = ["sea-orm/sqlx-sqlite", "sea-orm-migration/sqlx-sqlite"]
mysql = ["sea-orm/sqlx-mysql", "sea-orm-migration/sqlx-mysql"]
# Test databases for the store and API suites (`store::testing`). Needs both drivers to honour TEST_DATABASE_URL.
testing = ["sqlite", "mysql"]

[dependencies]
domain.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
googletest.workspace = true
tokio.workspace = true
# Lets this crate's own integration tests use `store::testing`.
store = { path = ".", default-features = false, features = ["testing"] }

[lints]
workspace = true
