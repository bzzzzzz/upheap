<!doctype html>
<meta charset="utf-8" />
<title>Upheap local spike</title>
<pre id="out">starting…</pre>
<script type="module">
  const out = document.getElementById("out");
  const log = [];
  const worker = new Worker("./worker.mjs", { type: "module" });
  worker.onerror = (e) => { out.textContent = "worker error: " + e.message; window.spikeResult = { error: e.message }; };
  worker.onmessage = ({ data }) => {
    log.push(data);
    out.textContent = JSON.stringify(log, null, 2);
    if (data.ready) worker.postMessage("run");
    else window.spikeResult = log;
  };
</script>
