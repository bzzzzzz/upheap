[package]
name = "local"
description = "The local build: the backend compiled to WebAssembly, on SQLite-wasm in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is wasm-only. SeaORM 2.0's `proxy` feature doesn't compile alongside its sqlx drivers, so it must not
# be turned on in a native build, where the workspace's features are unified with the server's.
[target.'cfg(target_arch = "wasm32")'.dependencies]
api.workspace = true
async-trait.workspace = true
axum.workspace = true
domain.workspace = true
getrandom = { workspace = true, features = ["wasm_js"] }
jiff = { workspace = true, features = ["js"] }
js-sys.workspace = true
sea-orm = { workspace = true, features = ["proxy"] }
# sea-orm-migration stamps applied migrations with `SystemTime::now()`, which panics on wasm, unless it uses `time`;
# `time` reads the clock through JS when its `wasm-bindgen` feature is on.
sea-orm-migration = { workspace = true, features = ["with-time"] }
serde_json.workspace = true
service.workspace = true
store = { workspace = true, features = ["proxy"] }
tower.workspace = true
time = { version = "0.3", features = ["wasm-bindgen"] }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true

[lints]
workspace = true

# wasm-pack's bundled wasm-opt predates the WebAssembly features Rust now emits by default, so they're named here.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
